name: Publish optimized Qwen model server

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - skypilot/model-server/**
      - .github/workflows/publish-model-image.yml

env:
  IMAGE: docker.io/sevenoraphael/qwen3-8-llama:cuda

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: sevenoraphael
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: skypilot/model-server
          file: skypilot/model-server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}
