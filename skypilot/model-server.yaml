# SkyPilot task for the requested GGUF model.
resources:
  accelerators: {L40S:1, A6000:1, A100-80GB:1}
  disk_size: 100
  ports: 8080
  # Prebuilt with RunPod's SSH runtime and the official llama.cpp CUDA server.
  image_id: docker:sevenoraphael/qwen3-8-llama:cuda

file_mounts:
  /tmp/qwen-model-server: ./skypilot/model-server

envs:
  MODEL_DOWNLOAD_URL: https://huggingface.co/OBLITERATUS/Qwen3.8-27B-OBLITERATED/resolve/main/Qwen3.8-27B-OBLITERATED-Q8_0.gguf
  MODEL_SHA256: afa839b2fa5bc890e5735031dda2c6239d3b6bba3b6ffa29477cbc14a2e1f221
  MODEL_ID: qwen3.8-27b-obliterated-q8
  CONTEXT_SIZE: "32768"

setup: |
  test -x /usr/local/bin/llama-server
  command -v aria2c

run: |
  mkdir -p ~/qwen-model-cache
  ln -sfn ~/qwen-model-cache /models
  exec bash /tmp/qwen-model-server/start-model-server.sh
